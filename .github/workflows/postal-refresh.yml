name: postal-refresh

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postal-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate postal data
        run: go run ./postal/cmd/postalrefresh postal/data
      - name: Test
        run: go test ./postal/
      - name: Commit and tag
        run: |
          if git diff --quiet -- postal/data && [ -z "$(git ls-files --others --exclude-standard postal/data)" ]; then
            echo "postal data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postal/data
          git commit -m "postal: monthly GeoNames data refresh"
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          next=$(echo "$latest" | awk -F. '{printf "%s.%s.%d", $1, $2, $3 + 1}')
          git tag "$next"
          git push origin HEAD:main "$next"
          echo "published $next"
